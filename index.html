<!doctype html>
<html lang="cs" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f8f7f4">
  <meta name="description" content="Game mods, screenshots and announcements from Denk172.">
  <title>Denk172 Mods</title>
  <link rel="icon" href="data:,">
  <script src="assets/js/init.js"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a class="skip-link" href="#content" data-en="Skip to content">Přejít na obsah</a>
  <div class="page">
    <aside class="wip-notice" id="wip-notice" aria-labelledby="wip-title" hidden>
      <div>
        <strong id="wip-title"></strong>
        <p id="wip-message"></p>
      </div>
      <button class="wip-close" type="button" aria-label="Zavřít upozornění" data-label-en="Dismiss notice">×</button>
    </aside>
    <header class="header">
      <a class="wordmark" href="#hry" aria-label="Denk172 Mods — všechny hry" data-label-en="Denk172 Mods — all games">Denk172 Mods</a>
      <div class="header-right">
        <div class="language-switch mono" role="group" aria-label="Jazyk stránky" data-label-en="Page language" hidden>
          <button class="language-option" type="button" data-language="cs" lang="cs" aria-label="Čeština" aria-pressed="false">CZ</button>
          <button class="language-option" type="button" data-language="en" lang="en" aria-label="English" aria-pressed="true">EN</button>
        </div>
        <button class="theme-toggle" type="button" aria-label="Tmavý vzhled" aria-pressed="false" title="Tmavý vzhled" hidden>
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20.6 14A8.8 8.8 0 0 1 10 3.4 8.8 8.8 0 1 0 20.6 14Z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <main id="content" tabindex="-1">
      <noscript><p lang="en">Enable JavaScript to browse the mods and galleries.</p></noscript>
      <p id="catalog-error" data-en="The mod catalog could not be loaded." hidden>Katalog modů se nepodařilo načíst.</p>
      <div id="hry" class="home-view">
        <div class="intro">
          <h1 tabindex="-1"><span id="home-heading"></span><span class="period">.</span></h1>
          <p id="home-intro" class="intro-text"></p>
        </div>
        <div id="announcements"></div>
        <nav aria-labelledby="games-heading">
          <div class="section-heading">
            <h2 id="games-heading" data-en="Choose a game">Vyber hru</h2>
          </div>
          <div class="games" id="games"></div>
        </nav>
      </div>
      <div id="game-view" hidden></div>
    </main>
    <footer class="site-tools">
      <a href="admin.html" data-en="Site admin">Správa webu</a>
    </footer>

  </div>
  <dialog class="image-viewer" aria-labelledby="viewer-caption">
    <div class="viewer-toolbar">
      <span class="viewer-counter mono" aria-live="polite"></span>
      <div class="viewer-actions">
        <button class="viewer-button viewer-zoom" type="button" aria-label="Plná velikost obrázku" data-label-en="Full-size image" aria-pressed="false">＋</button>
        <button class="viewer-button viewer-close" type="button" aria-label="Zavřít obrázky" data-label-en="Close images" autofocus>×</button>
      </div>
    </div>
    <div class="viewer-stage"><img class="viewer-image" alt="" draggable="false"></div>
    <div class="viewer-bottom">
      <button class="viewer-button viewer-previous" type="button" aria-label="Předchozí obrázek" data-label-en="Previous image">←</button>
      <p id="viewer-caption" class="viewer-caption" aria-live="polite"></p>
      <button class="viewer-button viewer-next" type="button" aria-label="Další obrázek" data-label-en="Next image">→</button>
    </div>
  </dialog>
  <script src="assets/js/catalog-format.js"></script>
  <script src="assets/data/catalog.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
